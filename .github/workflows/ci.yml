name: AppOpt CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ] # 当推送如 v2.2.3 的标签时触发发布
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================
  # 1. 代码质量检查 (Lint & Format)
  # =========================================================
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # =========================================================
  # 2. 核心构建与测试 (Linux + eBPF)
  # =========================================================
  build-linux:
    name: Build Linux & eBPF
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable        with:
          targets: bpfel-unknown-none
      
      - name: Install Rust nightly (eBPF build-std 需要)
        run: rustup toolchain install nightly --component rust-src

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build eBPF program
        run: |
          cd AppOpt-ebpf
          # 注意：如果您的项目已配置 build.rs 或 xtask 自动构建 eBPF，
          # 此步骤可简化为普通的 cargo build --release
          cargo +nightly build --release --target=bpfel-unknown-none -Z build-std=core

      - name: Build user-space program
        run: |
          cd AppOpt
          cargo build --release

      - name: Run tests
        run: cargo test --all

  # =========================================================
  # 3. Android 交叉编译 (核心目标平台)
  # =========================================================
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation linker (lld)
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build for Android (AArch64 / ARM64)        run: |
          cd AppOpt
          cargo build --release --target=aarch64-linux-android --config=target.aarch64-linux-android.linker=\"rust-lld\"

      - name: Build for Android (x86_64)
        run: |
          cd AppOpt
          cargo build --release --target=x86_64-linux-android --config=target.x86_64-linux-android.linker=\"rust-lld\"

      - name: Upload Android Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-Android-Binaries
          path: |
            AppOpt/target/aarch64-linux-android/release/AppOpt
            AppOpt/target/x86_64-linux-android/release/AppOpt
          retention-days: 7

  # =========================================================
  # 4. 自动发布 (当推送 Tag 时触发，例如 v2.2.3)
  # =========================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AppOpt-Android-Binaries
          path: ./release-assets

      - name: Rename binaries for clarity
        run: |
          cd ./release-assets
          mv aarch64-linux-android/release/AppOpt AppOpt-aarch64-linux-android
          mv x86_64-linux-android/release/AppOpt AppOpt-x86_64-linux-android

      # 可选：如果您希望将 modules_update 目录的内容也打包发布，可以取消下面的注释
      # - name: Copy modules_update to release assets
      #   run: cp -r modules_update ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/AppOpt-aarch64-linux-android
            ./release-assets/AppOpt-x86_64-linux-android
          generate_release_notes: true
