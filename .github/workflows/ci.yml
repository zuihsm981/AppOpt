name: Build AppOpt

on:
  workflow_dispatch:

jobs:
  build-ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          
      # 使用预编译的 bpf-linker，彻底解决 LLVM 依赖问题
      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
          
      - run: cd AppOpt-ebpf && cargo +nightly build --release --target=bpfel-unknown-none -Z build-std=core

  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          
      # 安装 cross 交叉编译工具，它自带 Android NDK 环境
      - uses: taiki-e/install-action@cross
      
      # 修复 web 目录路径问题
      - run: cp -r web AppOpt/web
      
      # 使用 cross 代替 cargo 进行编译，自动处理所有 C 库链接
      - run: cd AppOpt && cross build --release --target aarch64-linux-android
      
      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: AppOpt/target/aarch64-linux-android/release/AppOpt