name: AppOpt CI/CD

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-linux:
    name: Build Linux and eBPF
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:          targets: bpfel-unknown-none
          components: rust-src

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build eBPF program
        run: |
          cd AppOpt-ebpf
          cargo +nightly build --release --target=bpfel-unknown-none -Z build-std=core

      - name: Build user-space program
        run: |
          cd AppOpt
          cargo +nightly build --release

  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install lld linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Configure Cargo for Android cross-compilation
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-linux-android]' > .cargo/config.toml
          echo 'linker = "rust-lld"' >> .cargo/config.toml
          echo '[target.x86_64-linux-android]' >> .cargo/config.toml
          echo 'linker = "rust-lld"' >> .cargo/config.toml

      - name: Build for Android AArch64
        run: |
          cd AppOpt
          cargo +nightly build --release --target aarch64-linux-android
      - name: Build for Android x86_64
        run: |
          cd AppOpt
          cargo +nightly build --release --target x86_64-linux-android

      - name: Upload Android Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-Android-Binaries
          path: |
            AppOpt/target/aarch64-linux-android/release/AppOpt
            AppOpt/target/x86_64-linux-android/release/AppOpt
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-android
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AppOpt-Android-Binaries
          path: ./release-assets

      - name: Rename binaries
        run: |
          cd ./release-assets
          mv aarch64-linux-android/release/AppOpt AppOpt-aarch64-linux-android
          mv x86_64-linux-android/release/AppOpt AppOpt-x86_64-linux-android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/AppOpt-aarch64-linux-android
            ./release-assets/AppOpt-x86_64-linux-android
          generate_release_notes: true