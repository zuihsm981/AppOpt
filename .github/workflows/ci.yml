name: Build AppOpt

on:
  workflow_dispatch:

jobs:
  # 任务 1：构建 eBPF 内核态程序
  build-ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          
      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
          
      - name: Build eBPF
        run: cd AppOpt-ebpf && cargo +nightly build --release --target=bpfel-unknown-none -Z build-std=core
        env:
          # 强制覆盖优化级别，防止 bpf-linker 报错
          RUSTFLAGS: "-C opt-level=2"
          
      # 【新增】：上传 eBPF 产物
      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-ebpf
          path: AppOpt-ebpf/target/bpfel-unknown-none/release/AppOpt-ebpf

  # 任务 2：构建 Android 用户态程序 (ARM64)
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
          
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          
      - name: Copy web directory
        run: cp -r web AppOpt/web
        
      - name: Build for Android
        run: cd AppOpt && cargo ndk -t arm64-v8a build --release
        
      # 上传 Android 产物
      - uses: actions/upload-artifact@v4