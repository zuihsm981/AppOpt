name: Build AppOpt

on:
  workflow_dispatch:
    inputs:
      build_ebpf:
        description: '是否构建 eBPF 内核态程序 (AppOpt-ebpf)'
        required: true
        default: true
        type: boolean
      build_android:
        description: '是否构建 Android ARM64 用户态程序 (AppOpt)'
        required: true
        default: true
        type: boolean

jobs:
  build-ebpf:
    # 仅当用户在触发时勾选了 build_ebpf 时才运行此任务
    if: ${{ inputs.build_ebpf }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          
      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
          
      - name: Fix opt-level in Cargo.toml
        run: sed -i 's/opt-level = "s"/opt-level = 2/g' AppOpt-ebpf/Cargo.toml
          
      - name: Build eBPF
        run: cd AppOpt-ebpf && cargo +nightly build --release --target=bpfel-unknown-none -Z build-std=core

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-ebpf
          path: AppOpt-ebpf/target/bpfel-unknown-none/release/AppOpt-ebpf

  build-android-arm64:
    # 仅当用户在触发时勾选了 build_android 时才运行此任务
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
          
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          
      - name: Copy web directory
        run: cp -r web AppOpt/web
        
      - name: Build for Android
        run: cd AppOpt && cargo ndk -t arm64-v8a build --release
        
      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-android-arm64
          path: AppOpt/target/aarch64-linux-android/release/AppOpt